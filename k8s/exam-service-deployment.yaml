apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-service
  labels:
    app: exam-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exam-service
  template:
    metadata:
      labels:
        app: exam-service
    spec:
      containers:
      - name: exam-service
        image: sat-online-platform/exam-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3002
        env:
        - name: PORT
          value: "3002"
---
apiVersion: v1
kind: Service
metadata:
  name: exam-service-svc
spec:
  type: NodePort
  selector:
    app: exam-service
  ports:
    - port: 3002
      targetPort: 3002
      nodePort: 30002
