name: Automated Grading Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sat_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies for exam-service
        run: |
          cd services/exam-service
          npm install

      - name: Verify OpenAPI Spec and Kong Config
        run: |
          echo "Checking if required configuration files exist..."
          test -f docs/openapi.yaml
          test -f infra/kong.yml
          test -f services/exam-service/index.js
          echo "All structural files are present!"
